<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="video-container">
        <div class="video-wrapper">
            <h1 class="video-title">Video Player</h1>
            <div class="video-embed">
                <div class="responsive-iframe">
                    <iframe id="yt-iframe" src="https://www.youtube.com/embed/fWhq4QksrmY" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                </div>
            </div>
            <div class="video-info">
                <p>Amo po adi a choreo ta sa bayle hehe</p>
            </div>
        </div>
    </div>
    <script>
    // Attempt to lock orientation to landscape when iframe is fullscreen
    document.addEventListener('fullscreenchange', function() {
        const iframe = document.getElementById('yt-iframe');
        if (document.fullscreenElement === iframe || document.fullscreenElement?.contains(iframe)) {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
        } else {
            if (screen.orientation && screen.orientation.unlock) {
                screen.orientation.unlock();
            }
        }
    });
    </script>
</body>
</html>
